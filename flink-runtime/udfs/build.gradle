plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.flink.notebooks'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '1.20.0'
}

// Support compiling UDFs from workspace directory (user's project)
// Pass via: ./gradlew shadowJar -PworkspaceUdfDir=/path/to/workspace/udfs
def workspaceUdfDir = project.findProperty('workspaceUdfDir')

sourceSets {
    main {
        java {
            // Always include bundled examples (read-only, shipped with extension)
            srcDir 'src/main/java'

            // Include workspace UDFs if directory is specified and exists
            if (workspaceUdfDir) {
                def workspaceSourceDir = file("${workspaceUdfDir}/src/main/java")
                if (workspaceSourceDir.exists()) {
                    srcDir workspaceSourceDir
                    println "Including workspace UDFs from: ${workspaceSourceDir}"
                } else {
                    println "Workspace UDF directory not found: ${workspaceSourceDir}"
                    println "Only bundled examples will be compiled."
                }
            } else {
                println "No workspace UDF directory specified (-PworkspaceUdfDir)"
                println "Only bundled examples will be compiled."
            }
        }
    }
}

dependencies {
    // Flink Table API - required for UDF base classes
    compileOnly "org.apache.flink:flink-table-api-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-table-common:${flinkVersion}"

    // Optional: Add other dependencies your UDFs might need
    // compileOnly "org.apache.commons:commons-lang3:3.12.0"
}

shadowJar {
    archiveBaseName = 'flink-udfs'
    archiveClassifier = ''
    archiveVersion = ''

    // Output directly to lib directory
    destinationDirectory = file('../lib')

    // Exclude signature files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Exclude Flink classes (they're already in the cluster classpath)
    exclude 'org/apache/flink/**'

    // Don't include dependencies that are already in main JAR
    dependencies {
        exclude(dependency('org.apache.flink:.*'))
    }

    mergeServiceFiles()
}

// Make build task depend on shadowJar
tasks.build.dependsOn shadowJar

// Task to quickly rebuild and deploy UDFs
task deployUdfs {
    dependsOn shadowJar
    doLast {
        println "UDFs deployed to: ${shadowJar.archiveFile.get()}"
        println "Restart the Flink cluster to load the new UDFs, or use CREATE TEMPORARY FUNCTION to register them."
    }
}
