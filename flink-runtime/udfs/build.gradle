plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.flink.notebooks'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '1.20.0'
}

// Support compiling UDFs from one or more source directories.
// Pass via: ./gradlew :udfs:shadowJar -PudfSourceDirs=/path/a/src/main/java,/path/b/src/main/java
//   - Each path is used as-is as a Java source root; pass the innermost
//     directory that contains .java files (e.g. src/main/java).
//   - Empty/missing paths are logged and skipped.
def udfSourceDirsProp = project.findProperty('udfSourceDirs') ?: ''
def udfSourceDirs = udfSourceDirsProp
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

sourceSets {
    main {
        java {
            // Always include bundled examples (shipped with the extension).
            srcDir 'src/main/java'

            udfSourceDirs.each { dirPath ->
                def dir = file(dirPath)
                if (dir.exists()) {
                    srcDir dir
                    logger.info "Including UDF source dir: ${dir}"
                } else {
                    logger.info "UDF source dir not found, skipping: ${dir}"
                }
            }

            if (udfSourceDirs.isEmpty()) {
                logger.info "No -PudfSourceDirs specified; building bundled examples only."
            }
        }
    }
}

dependencies {
    // Flink Table API - required for UDF base classes
    compileOnly "org.apache.flink:flink-table-api-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-table-common:${flinkVersion}"

    // Optional: Add other dependencies your UDFs might need
    // compileOnly "org.apache.commons:commons-lang3:3.12.0"
}

shadowJar {
    archiveBaseName = 'flink-udfs'
    archiveClassifier = ''
    archiveVersion = ''

    // Output to a caller-specified directory (workspace/.flink-udfs by default
    // when invoked from the extension). Falls back to ../lib when unset so
    // that running gradle directly from the CLI still works.
    def udfOutputDirProp = project.findProperty('udfOutputDir')?.trim()
    destinationDirectory = udfOutputDirProp ? file(udfOutputDirProp) : file('../lib')

    // Exclude signature files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Exclude Flink classes (they're already in the cluster classpath)
    exclude 'org/apache/flink/**'

    // Don't include dependencies that are already in main JAR
    dependencies {
        exclude(dependency('org.apache.flink:.*'))
    }

    mergeServiceFiles()
}

// Make build task depend on shadowJar
tasks.build.dependsOn shadowJar

// Task to quickly rebuild and deploy UDFs
task deployUdfs {
    dependsOn shadowJar
    doLast {
        println "UDFs deployed to: ${shadowJar.archiveFile.get()}"
        println "Restart the Flink cluster to load the new UDFs, or use CREATE TEMPORARY FUNCTION to register them."
    }
}
