# Gradle JVM settings for building with large dependencies (Hadoop, Iceberg, AWS SDK)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Use Gradle toolchain to auto-provision Java 17 (set in build.gradle)
# This ensures compatibility with Flink 1.20.0 regardless of system Java version
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
